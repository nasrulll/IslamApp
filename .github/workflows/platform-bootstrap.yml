name: Platform bootstrap quality checks
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/api/**"
      - "tests/test_api_bootstrap.py"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/platform-bootstrap.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/api/**"
      - "tests/test_api_bootstrap.py"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
permissions:
  contents: read
jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m ruff check services/api/app tests/test_api_bootstrap.py
      - run: python -m pytest tests/test_api_bootstrap.py -q
  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
